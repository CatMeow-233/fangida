name: Fangida CI
on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[config,disasm]'
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Build and install the distribution wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist').glob('fangida-*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Verify installed resources and entry points outside the source tree
        run: python -I .github/scripts/verify_wheel.py

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: cmake -S native/cpp -B build/native-cpp
      - run: cmake --build build/native-cpp --config Release
      - run: ctest --test-dir build/native-cpp -C Release --output-on-failure
      - run: cargo fmt --manifest-path native/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native/rust/Cargo.toml
      - run: cargo build --manifest-path native/rust/Cargo.toml
      - name: Verify C++ and Rust shared libraries through the Python ABI
        run: python -I .github/scripts/verify_native.py
