[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fangida"
version = "0.4.0"
description = "Modular native and Android binary analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
disasm = ["capstone>=5,<6"]
config = ["PyYAML>=6,<7"]
br-solver = ["unicorn>=2.1,<3"]

[project.scripts]
fangida = "fangida.ui:main"
fangida-mcp = "fangida.mcp_server:main"
fangida-bench = "fangida.benchmark:main"
fangida-gui = "fangida.gui:main"
fangida-project = "fangida.project_cli:main"
fangida-db = "fangida.database_cli:main"
fangida-mcp-http = "fangida.mcp_http:main"
fangida-agent = "fangida.agent_cli:main"

[tool.setuptools.packages.find]
include = ["fangida*"]

[tool.setuptools.package-data]
"fangida.core.kkagent.ghidra_bridge" = ["*.java"]
"fangida.core.apk_analyzer" = ["PROTOCOL.md"]
"fangida.scripts" = ["README.md"]
"fangida.plugins.br_solver" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
